input {
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["user-activity"]
        group_id => "activity-consumer"
        client_id => "logstash-activity"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["exam-logs"]
        group_id => "exam-logs-consumer"
        client_id => "logstash-exam-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["class-logs"]
        group_id => "class-logs-consumer"
        client_id => "logstash-class-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-logs"]
        group_id => "secure-agent-logs-consumer"
        client_id => "logstash-secure-agent-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-events"]
        group_id => "secure-agent-events-consumer"
        client_id => "logstash-secure-agent-events"
        auto_offset_reset => "earliest"
        codec => "json"
    }
}

filter {
    if [@metadata][kafka][topic] == "user-activity" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "memberId" => "%{[parsed][memberId]}"
                "memberName" => "%{[parsed][memberName]}"
                "role" => "%{[parsed][role]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "classroomStudentNo" => "%{[parsed][classroomStudentNo]}"
                "textbookNo" => "%{[parsed][textbookNo]}"
                "textbookTitle" => "%{[parsed][textbookTitle]}"
                "textbookSubject" => "%{[parsed][textbookSubject]}"
                "textbookGrade" => "%{[parsed][textbookGrade]}"
                "textbookPublisher" => "%{[parsed][textbookPublisher]}"
                "textbookSemester" => "%{[parsed][textbookSemester]}"
                "eventType" => "%{[parsed][eventType]}"
                "eventTime" => "%{[parsed][eventTime]}"
                "eventDate" => "%{[parsed][eventDate]}"
                "userAgent" => "%{[parsed][userAgent]}"
                "browserInfo" => "%{[parsed][browserInfo]}"
                "processedAt" => "%{[parsed][processedAt]}"
                "studentName" => "%{[parsed][memberName]}"
                "anomalyType" => "%{[parsed][eventType]}"
                "timestamp" => "%{[parsed][processedAt]}"
            }
            remove_field => ["message", "parsed"]
        }
        date {
            match => [ "eventTime", "ISO8601" ]
            target => "@timestamp"
        }
    }

if [@metadata][kafka][topic] == "exam-logs" {
        json {
            source => "message"
            target => "parsed"
        }

        if [parsed][examNo] {
            mutate { add_field => { "examNo" => "%{[parsed][examNo]}" } }
            mutate { convert => { "examNo" => "integer" } }
        }

        if [parsed][studentNo] {
            mutate { add_field => { "studentNo" => "%{[parsed][studentNo]}" } }
            mutate { convert => { "studentNo" => "integer" } }
        }

        if [parsed][problemNo] {
            mutate { add_field => { "problemNo" => "%{[parsed][problemNo]}" } }
            mutate { convert => { "problemNo" => "integer" } }
        }

        if [parsed][solvingTime] {
            mutate { add_field => { "solvingTime" => "%{[parsed][solvingTime]}" } }
            mutate { convert => { "solvingTime" => "integer" } }
        }

        if [parsed][afkCount] and [parsed][afkCount] != "null" {
            mutate { add_field => { "afkCount" => "%{[parsed][afkCount]}" } }
            mutate { convert => { "afkCount" => "integer" } }
        } else {
            mutate { add_field => { "afkCount" => "0" } }
            mutate { convert => { "afkCount" => "integer" } }
        }

        if [parsed][rightClickCount] and [parsed][rightClickCount] != "null" {
            mutate { add_field => { "rightClickCount" => "%{[parsed][rightClickCount]}" } }
            mutate { convert => { "rightClickCount" => "integer" } }
        } else {
            mutate { add_field => { "rightClickCount" => "0" } }
            mutate { convert => { "rightClickCount" => "integer" } }
        }

        if [parsed][timestamp] {
            mutate { add_field => { "timestamp" => "%{[parsed][timestamp]}" } }
            date {
                match => [ "timestamp", "ISO8601" ]
                target => "@timestamp"
            }
        }

        if [parsed][processedAt] {
            mutate { add_field => { "processedAt" => "%{[parsed][processedAt]}" } }
        }

        mutate { remove_field => ["message", "parsed"] }
    }
    if [@metadata][kafka][topic] == "class-logs" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "examNo" => "%{[parsed][examNo]}"
                "studentNo" => "%{[parsed][studentNo]}"
                "classroomStudentNo" => "%{[parsed][classroomStudentNo]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "timestamp" => "%{[parsed][timestamp]}"
                "problemNo" => "%{[parsed][problemNo]}"
                "solvingTime" => "%{[parsed][solvingTime]}"
                "controlVCount" => "%{[parsed][controlVCount]}"
                "controlCCount" => "%{[parsed][controlCCount]}"
                "afkCount" => "%{[parsed][afkCount]}"
                "devToolsCount" => "%{[parsed][devToolsCount]}"
                "rightClickCount" => "%{[parsed][rightClickCount]}"
                "focusLossCount" => "%{[parsed][focusLossCount]}"
                "tabSwitchCount" => "%{[parsed][tabSwitchCount]}"
                "totalSuspiciousCount" => "%{[parsed][totalSuspiciousCount]}"
                "riskLevel" => "%{[parsed][riskLevel]}"
                "eventType" => "%{[parsed][eventType]}"
                "processedAt" => "%{[parsed][processedAt]}"
            }
            remove_field => ["message", "parsed"]
        }
        date {
            match => [ "timestamp", "ISO8601" ]
            target => "@timestamp"
        }
    }

    if [@metadata][kafka][topic] == "secure-agent-logs" {
        json {
            source => "message"
            target => "parsed"
        }
        date {
            match => ["timestamp", "ISO8601"]
            target => "@timestamp"
        }
    }

    if [@metadata][kafka][topic] == "secure-agent-events" {
        json {
            source => "message"
            target => "parsed"
        }
        date {
            match => ["ts", "ISO8601"]
            target => "@timestamp"
        }
    }
}

output {
    if [topic] == "user-activity" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "user-activity-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "exam-logs" {
            stdout {
                codec => rubydebug {
                    metadata => true
                }
            }
            elasticsearch {
                hosts => ["elasticsearch:9200"]
                index => "exam-logs-%{+YYYY.MM.dd}"
            }
        }

    if [topic] == "class-logs" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "class-logs-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "secure-agent-logs" {
        elasticsearch {
          hosts => ["elasticsearch:9200"]
          index => "secure-agent-logs-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "secure-agent-events" {
        elasticsearch {
          hosts => ["elasticsearch:9200"]
          index => "secure-agent-events-%{+YYYY.MM.dd}"
        }
    }
}