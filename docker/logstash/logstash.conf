input {
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["user-activity"]
        group_id => "activity-consumer"
        client_id => "logstash-activity"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["exam-logs"]
        group_id => "exam-logs-consumer"
        client_id => "logstash-exam-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["class-logs"]
        group_id => "class-logs-consumer"
        client_id => "logstash-class-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-logs"]
        group_id => "secure-agent-logs-consumer"
        client_id => "logstash-secure-agent-logs"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-events"]
        group_id => "secure-agent-events-consumer"
        client_id => "logstash-secure-agent-events"
        auto_offset_reset => "earliest"
        codec => "json"
    }
}

filter {
    if [@metadata][kafka][topic] == "user-activity" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "memberId" => "%{[parsed][memberId]}"
                "memberName" => "%{[parsed][memberName]}"
                "role" => "%{[parsed][role]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "classroomStudentNo" => "%{[parsed][classroomStudentNo]}"
                "textbookNo" => "%{[parsed][textbookNo]}"
                "textbookTitle" => "%{[parsed][textbookTitle]}"
                "textbookSubject" => "%{[parsed][textbookSubject]}"
                "textbookGrade" => "%{[parsed][textbookGrade]}"
                "textbookPublisher" => "%{[parsed][textbookPublisher]}"
                "textbookSemester" => "%{[parsed][textbookSemester]}"
                "eventType" => "%{[parsed][eventType]}"
                "eventTime" => "%{[parsed][eventTime]}"
                "eventDate" => "%{[parsed][eventDate]}"
                "userAgent" => "%{[parsed][userAgent]}"
                "browserInfo" => "%{[parsed][browserInfo]}"
                "processedAt" => "%{[parsed][processedAt]}"
                "studentName" => "%{[parsed][memberName]}"
                "anomalyType" => "%{[parsed][eventType]}"
                "timestamp" => "%{[parsed][processedAt]}"
            }
            remove_field => ["message", "parsed"]
        }
        date {
            match => [ "eventTime", "ISO8601" ]
            target => "@timestamp"
        }
    }

       if [@metadata][kafka][topic] == "exam-logs" {
           json {
               source => "message"
               target => "parsed"
           }
           mutate {
               add_field => {
                   "examNo" => "%{[parsed][examNo]}"
                   "studentNo" => "%{[parsed][studentNo]}"
                   "classroomNo" => "%{[parsed][classroomNo]}"
                   "timestamp" => "%{[parsed][timestamp]}"
                   "problemNo" => "%{[parsed][problemNo]}"
                   "solvingTime" => "%{[parsed][solvingTime]}"
                   "controlVCount" => "%{[parsed][controlVCount]}"
                   "controlCCount" => "%{[parsed][controlCCount]}"
                   "afkCount" => "%{[parsed][afkCount]}"
                   "devToolsCount" => "%{[parsed][devToolsCount]}"
                   "rightClickCount" => "%{[parsed][rightClickCount]}"
                   "focusLossCount" => "%{[parsed][focusLossCount]}"
                   "tabSwitchCount" => "%{[parsed][tabSwitchCount]}"
                   "processedAt" => "%{[parsed][processedAt]}"
               }
               remove_field => ["message", "parsed"]
           }
           date {
               match => [ "timestamp", "ISO8601" ]
               target => "@timestamp"
           }
                   if [examNo] and [examNo] != "" and [examNo] != "null" {
                       mutate { convert => { "examNo" => "integer" } }
                   } else {
                       mutate { replace => { "examNo" => 0 } convert => { "examNo" => "integer" } }
                   }

                   if [studentNo] and [studentNo] != "" and [studentNo] != "null" {
                       mutate { convert => { "studentNo" => "integer" } }
                   } else {
                       mutate { replace => { "studentNo" => 0 } convert => { "studentNo" => "integer" } }
                   }

                   if [classroomStudentNo] and [classroomStudentNo] != "" and [classroomStudentNo] != "null" {
                       mutate { convert => { "classroomStudentNo" => "integer" } }
                   } else {
                       mutate { replace => { "classroomStudentNo" => 0 } convert => { "classroomStudentNo" => "integer" } }
                   }

                   if [classroomNo] and [classroomNo] != "" and [classroomNo] != "null" {
                       mutate { convert => { "classroomNo" => "integer" } }
                   } else {
                       mutate { replace => { "classroomNo" => 0 } convert => { "classroomNo" => "integer" } }
                   }

                   if [problemNo] and [problemNo] != "" and [problemNo] != "null" {
                       mutate { convert => { "problemNo" => "integer" } }
                   } else {
                       mutate { replace => { "problemNo" => 0 } convert => { "problemNo" => "integer" } }
                   }

                   if [solvingTime] and [solvingTime] != "" and [solvingTime] != "null" {
                       mutate { convert => { "solvingTime" => "integer" } }
                   } else {
                       mutate { replace => { "solvingTime" => 0 } convert => { "solvingTime" => "integer" } }
                   }

                   if [controlVCount] and [controlVCount] != "" and [controlVCount] != "null" {
                       mutate { convert => { "controlVCount" => "integer" } }
                   } else {
                       mutate { replace => { "controlVCount" => 0 } convert => { "controlVCount" => "integer" } }
                   }

                   if [controlCCount] and [controlCCount] != "" and [controlCCount] != "null" {
                       mutate { convert => { "controlCCount" => "integer" } }
                   } else {
                       mutate { replace => { "controlCCount" => 0 } convert => { "controlCCount" => "integer" } }
                   }

                   if [afkCount] and [afkCount] != "" and [afkCount] != "null" {
                       mutate { convert => { "afkCount" => "integer" } }
                   } else {
                       mutate { replace => { "afkCount" => 0 } convert => { "afkCount" => "integer" } }
                   }

                   if [devToolsCount] and [devToolsCount] != "" and [devToolsCount] != "null" {
                       mutate { convert => { "devToolsCount" => "integer" } }
                   } else {
                       mutate { replace => { "devToolsCount" => 0 } convert => { "devToolsCount" => "integer" } }
                   }

                   if [rightClickCount] and [rightClickCount] != "" and [rightClickCount] != "null" {
                       mutate { convert => { "rightClickCount" => "integer" } }
                   } else {
                       mutate { replace => { "rightClickCount" => 0 } convert => { "rightClickCount" => "integer" } }
                   }

                   if [focusLossCount] and [focusLossCount] != "" and [focusLossCount] != "null" {
                       mutate { convert => { "focusLossCount" => "integer" } }
                   } else {
                       mutate { replace => { "focusLossCount" => 0 } convert => { "focusLossCount" => "integer" } }
                   }

                   if [tabSwitchCount] and [tabSwitchCount] != "" and [tabSwitchCount] != "null" {
                       mutate { convert => { "tabSwitchCount" => "integer" } }
                   } else {
                       mutate { replace => { "tabSwitchCount" => 0 } convert => { "tabSwitchCount" => "integer" } }
                   }

                   if [totalSuspiciousCount] and [totalSuspiciousCount] != "" and [totalSuspiciousCount] != "null" {
                       mutate { convert => { "totalSuspiciousCount" => "integer" } }
                   } else {
                       mutate { replace => { "totalSuspiciousCount" => 0 } convert => { "totalSuspiciousCount" => "integer" } }
                   }
     }
    if [@metadata][kafka][topic] == "class-logs" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "examNo" => "%{[parsed][examNo]}"
                "studentNo" => "%{[parsed][studentNo]}"
                "classroomStudentNo" => "%{[parsed][classroomStudentNo]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "timestamp" => "%{[parsed][timestamp]}"
                "problemNo" => "%{[parsed][problemNo]}"
                "solvingTime" => "%{[parsed][solvingTime]}"
                "controlVCount" => "%{[parsed][controlVCount]}"
                "controlCCount" => "%{[parsed][controlCCount]}"
                "afkCount" => "%{[parsed][afkCount]}"
                "devToolsCount" => "%{[parsed][devToolsCount]}"
                "rightClickCount" => "%{[parsed][rightClickCount]}"
                "focusLossCount" => "%{[parsed][focusLossCount]}"
                "tabSwitchCount" => "%{[parsed][tabSwitchCount]}"
                "totalSuspiciousCount" => "%{[parsed][totalSuspiciousCount]}"
                "riskLevel" => "%{[parsed][riskLevel]}"
                "eventType" => "%{[parsed][eventType]}"
                "processedAt" => "%{[parsed][processedAt]}"
            }
            remove_field => ["message", "parsed"]
        }
    }
    if [@metadata][kafka][topic] == "secure-agent-logs" {
        # AgentIngestController가 넣은 timestamp(ISO8601)를 @timestamp로 지정
        date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
    }

    if [@metadata][kafka][topic] == "secure-agent-events" {
        # 포렌식 페이로드의 ts(ISO8601)를 @timestamp로 지정
        date { match => ["ts", "ISO8601"] target => "@timestamp" }
    }
}

output {
    if [@metadata][kafka][topic] == "user-activity" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "user-activity-%{+YYYY.MM.dd}"
        }
    }

    if [@metadata][kafka][topic] == "exam-logs" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "exam-logs-%{+YYYY.MM.dd}"
        }
    }

    if [@metadata][kafka][topic] == "class-logs" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "class-logs-%{+YYYY.MM.dd}"
        }
    }

    if [@metadata][kafka][topic] == "secure-agent-logs" {
        elasticsearch {
          hosts => ["elasticsearch:9200"]
          index => "secure-agent-logs-%{+YYYY.MM.dd}"
        }
    }
    if [@metadata][kafka][topic] == "secure-agent-events" {
        elasticsearch {
          hosts => ["elasticsearch:9200"]
          index => "secure-agent-events-%{+YYYY.MM.dd}"
        }
    }
}