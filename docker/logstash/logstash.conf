input {
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["app-logs"]
        group_id => "logs-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["user-activity"]
        group_id => "activity-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["exam-events"]
        group_id => "exam-events-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["exam-results"]
        group_id => "exam-results-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
    }
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["exam-analytics"]
        group_id => "exam-analytics-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
    }
}

filter {
    if [topic] == "app-logs" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "traceId" => "%{[parsed][traceId]}"
                "timestamp" => "%{[parsed][timestamp]}"
                "level" => "%{[parsed][level]}"
                "prefix" => "%{[parsed][prefix]}"
                "logMessage" => "%{[parsed][message]}"
                "args" => "%{[parsed][args]}"
                "executionTimeMs" => "%{[parsed][timeMs]}"
                "exception" => "%{[parsed][exception]}"
            }
            remove_field => ["message", "parsed"]
        }
    }

    if [topic] == "user-activity" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "memberId" => "%{[parsed][memberId]}"
                "memberName" => "%{[parsed][memberName]}"
                "role" => "%{[parsed][role]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "classroomStudentNo" => "%{[parsed][classroomStudentNo]}"
                "textbookNo" => "%{[parsed][textbookNo]}"
                "textbookTitle" => "%{[parsed][textbookTitle]}"
                "textbookSubject" => "%{[parsed][textbookSubject]}"
                "textbookGrade" => "%{[parsed][textbookGrade]}"
                "textbookPublisher" => "%{[parsed][textbookPublisher]}"
                "textbookSemester" => "%{[parsed][textbookSemester]}"
                "eventType" => "%{[parsed][eventType]}"
                "eventTime" => "%{[parsed][eventTime]}"
                "eventDate" => "%{[parsed][eventDate]}"
                "userAgent" => "%{[parsed][userAgent]}"
                "browserInfo" => "%{[parsed][browserInfo]}"
                "processedAt" => "%{[parsed][processedAt]}"
                # 기존 필드들도 호환성을 위해 유지
                "studentName" => "%{[parsed][memberName]}"
                "anomalyType" => "%{[parsed][eventType]}"
                "timestamp" => "%{[parsed][processedAt]}"
            }
            remove_field => ["message", "parsed"]
        }

        # 날짜 파싱 추가
        date {
            match => [ "eventTime", "ISO8601" ]
            target => "@timestamp"
        }
    }

    if [topic] == "exam-events" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "examNo" => "%{[parsed][examNo]}"
                "studentNo" => "%{[parsed][studentNo]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "eventType" => "%{[parsed][eventType]}"
                "timestamp" => "%{[parsed][timestamp]}"
                "examTitle" => "%{[parsed][examTitle]}"
                "questionNo" => "%{[parsed][questionNo]}"
                "actionData" => "%{[parsed][actionData]}"
            }
            remove_field => ["message", "parsed"]
        }
    }

    if [topic] == "exam-results" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "examNo" => "%{[parsed][examNo]}"
                "studentNo" => "%{[parsed][studentNo]}"
                "classroomNo" => "%{[parsed][classroomNo]}"
                "totalQuestions" => "%{[parsed][totalQuestions]}"
                "correctAnswers" => "%{[parsed][correctAnswers]}"
                "score" => "%{[parsed][score]}"
                "completedAt" => "%{[parsed][completedAt]}"
                "timeSpent" => "%{[parsed][timeSpent]}"
                "answers" => "%{[parsed][answers]}"
            }
            remove_field => ["message", "parsed"]
        }
    }

    if [topic] == "exam-analytics" {
        json {
            source => "message"
            target => "parsed"
        }
        mutate {
            add_field => {
                "examNo" => "%{[parsed][examNo]}"
                "questionNo" => "%{[parsed][questionNo]}"
                "difficultyLevel" => "%{[parsed][difficultyLevel]}"
                "correctRate" => "%{[parsed][correctRate]}"
                "averageTime" => "%{[parsed][averageTime]}"
                "unitNo" => "%{[parsed][unitNo]}"
                "analysisType" => "%{[parsed][analysisType]}"
                "timestamp" => "%{[parsed][timestamp]}"
            }
            remove_field => ["message", "parsed"]
        }
    }
}

output {
    if [topic] == "app-logs" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "app-logs-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "user-activity" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "user-activity-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "exam-events" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "exam-events-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "exam-results" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "exam-results-%{+YYYY.MM.dd}"
        }
    }

    if [topic] == "exam-analytics" {
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "exam-analytics-%{+YYYY.MM.dd}"
        }
    }
}