input {
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["exam-logs"]
        group_id => "exam-logs-consumer"
        client_id => "logstash-exam-logs"
        auto_offset_reset => "earliest"
        codec => "json"
        decorate_events => true
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-logs"]
        group_id => "secure-agent-logs-consumer"
        client_id => "logstash-secure-agent-logs"
        auto_offset_reset => "earliest"
        codec => "json"
        decorate_events => true
    }
    kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["secure-agent-events"]
        group_id => "secure-agent-events-consumer"
        client_id => "logstash-secure-agent-events"
        auto_offset_reset => "earliest"
        codec => "json"
        decorate_events => true
    }
}

filter {
}

output {
    stdout {
        codec => rubydebug { metadata => true }
    }
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "%{[@metadata][kafka][topic]}"
    }
}