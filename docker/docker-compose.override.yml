services:
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://43.200.2.244:9092,BROKER://kafka:29092

  kafka-exporter:
    environment:
      KAFKA_SERVER: kafka:29092

  redis-exporter:
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis://redis:6379

  elasticsearch:
    environment:
      - xpack.security.enabled=false